version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrapesuite
      POSTGRES_PASSWORD: scrapesuite
      POSTGRES_DB: scrapesuite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapesuite"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODE: api
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://scrapesuite:scrapesuite@postgres:5432/scrapesuite
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker Process
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODE: worker
      NODE_ENV: production
      DATABASE_URL: postgresql://scrapesuite:scrapesuite@postgres:5432/scrapesuite
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HTTP_WORKER_CONCURRENCY: 50
      BROWSER_WORKER_CONCURRENCY: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

volumes:
  pgdata:
  redisdata:
